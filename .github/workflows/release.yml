name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - scripts/release.sh
      - apps/web/package-lock.json
      - apps/server/build.rs
      - rust-toolchain.toml
      - Cargo.lock
      - "**/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    # Each target builds where it runs, so its binary can report its version.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - run: scripts/release.sh ${{ matrix.target }} | tee -a "$GITHUB_STEP_SUMMARY"
      # Artifacts are zipped without file modes; a tar keeps the binary executable.
      - run: tar -cf weacon-${{ matrix.target }}.tar -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weacon-${{ matrix.target }}
          path: weacon-${{ matrix.target }}.tar
          if-no-files-found: error

  server:
    name: server ${{ matrix.target }}
    # Servers run on Linux only.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --prefix apps/web --include=dev --no-audit --no-fund
      - run: scripts/release.sh server ${{ matrix.target }} | tee -a "$GITHUB_STEP_SUMMARY"
      - run: tar -cf weacon-server-${{ matrix.target }}.tar -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weacon-server-${{ matrix.target }}
          path: weacon-server-${{ matrix.target }}.tar
          if-no-files-found: error
