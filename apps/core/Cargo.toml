[package]
name = "weacon-core"
description = "The Weacon core: the daemon and the weacon command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "weacon"
path = "src/main.rs"

[dependencies]
clap.workspace = true
futures-util.workspace = true
getrandom.workspace = true
minisign-verify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
ureq.workspace = true
weacon-agents.workspace = true
weacon-appkit.workspace = true
weacon-client.workspace = true
weacon-codemap.workspace = true
weacon-observability.workspace = true
weacon-protocol.workspace = true
weacon-version.workspace = true
webpki-roots.workspace = true
x25519-dalek.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
rcgen.workspace = true
tokio = { workspace = true, features = ["test-util"] }
weacon-testing.workspace = true

[build-dependencies]
weacon-version.workspace = true

[lints]
workspace = true
