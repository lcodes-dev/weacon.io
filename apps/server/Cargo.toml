[package]
name = "weacon-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
rand = "0.10.4"
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["derive", "macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
