[package]
name = "weacon-server"
version = "0.1.0"
edition = "2024"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
aws-lc-rs = "1.19.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
code-map = { path = "../../crates/code-map" }
core-link = { path = "../../crates/core-link" }
doc-search = { path = "../../crates/doc-search" }
flate2 = "1.1.11"
jsonwebtoken = { version = "12.0.0", features = ["aws_lc_rs"] }
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["derive", "json", "macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v7"] }

[dev-dependencies]
futures-util = "0.3.34"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
