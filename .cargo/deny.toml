[graph]
all-features = true

[advisories]
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    # Remove when sqlx allows libsqlite3-sys >= 0.39, which bundles SQLite 3.54.
    { id = "RUSTSEC-2026-0459", reason = "sqlx 0.9 can't take the fixed libsqlite3-sys yet; restore refuses a backup with a -wal or -journal beside it, and opens it immutable" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # The Mozilla root certificates in webpki-roots.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
