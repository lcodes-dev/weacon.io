# `emit` only prints what `instructions` returns, and its tests cover that.
# `flush` on a file opened for appending does nothing that a test could see.
# `random_id` joins two halves that never overlap, so `|` and `^` give the same id; so do the
# flags `open_pair` opens with, where `&` leaves the master blocking: a test catches that, but
# the terminal tests hang on it instead of failing.
# `open_unfollowed`'s two flags share no bits either, so `^` gives the same flags; `&` drops both,
# and the pipe test then hangs instead of failing. The same holds for `open_beneath`'s flags.
# A `Lines::next` that always returns a line never ends, so every reader spins instead of failing.
# `depth * 1` in `full_names` isn't equivalent: it never deepens, so a self-nesting subcommand
# expands until the test is killed for memory, which takes CI's runner with it.
# Windows code isn't built on Linux, where mutation tests run; the Windows CI job tests it.
# Nor is the macOS pty, macOS's or other systems' `trash`; the rest of macOS's Trash is tested
# on Linux.
# Linux's `trash` and `own_uid` only find the real Trash, so no test runs them: any mutant of
# how a Trash is picked would send a test's item to the real drive's top. Tests go through
# `trash_into` instead.
# On Linux, a Trash name that can't be checked can't be moved into either; `place`'s guard
# matters where the Trash can be written but not read, as macOS may allow.
exclude_globs = [
    "**/platform/**/windows.rs",
    "**/platform/pty/windows/*.rs",
    "**/platform/windows/*.rs",
    "**/platform/pty/macos.rs",
]
exclude_re = [
    "replace emit with \\(\\)",
    "replace <impl Write for RotatingFile>::flush",
    "replace \\| with \\^ in random_id",
    "replace \\| with (\\^|&) in open_pair",
    "replace \\| with (\\^|&) in unix::open_unfollowed",
    "platform/beneath\\.rs:.*: replace \\| with (\\^|&)$",
    "windows::",
    "platform/trash(/macos|/linux)?\\.rs:.*(replace trash ->| in trash$|replace own_uid ->)",
    "replace match guard error.kind\\(\\) == io::ErrorKind::NotFound with true in place$",
    "replace Lines<R>::next -> io::Result<Option<Vec<u8>>> with Ok\\(Some",
    "replace \\+ with \\* in full_names",
]
# Some mutants make a blocking client wait out its 5 s read timeout.
minimum_test_timeout = 60
