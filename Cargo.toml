[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "tooling/*"]
# The Chrome extension is TypeScript.
exclude = ["apps/extension"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
clap = { version = "4.6.7", features = ["derive", "string"] }
libc = "0.2.191"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
schemars = "1.2.3"
sentry-types = { version = "0.49.5", default-features = false, features = ["protocol"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "net", "rt", "signal", "time"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
weacon-agents = { path = "crates/agents" }
weacon-appkit = { path = "crates/appkit" }
weacon-client = { path = "crates/client" }
weacon-codemap = { path = "crates/codemap" }
weacon-observability = { path = "crates/observability" }
weacon-protocol = { path = "crates/protocol" }
weacon-testing = { path = "crates/testing" }
weacon-version = { path = "crates/version" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[workspace.lints.rust]
unsafe_code = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
redundant_lifetimes = "warn"
unit_bindings = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
let_underscore_drop = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_conversions = "warn"
assertions_on_result_states = "warn"
branches_sharing_code = "warn"
clone_on_ref_ptr = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
derive_partial_eq_without_eq = "warn"
empty_structs_with_brackets = "warn"
equatable_if_let = "warn"
excessive_nesting = "warn"
exit = "warn"
expect_used = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
iter_on_single_items = "warn"
iter_over_hash_type = "warn"
iter_with_drain = "warn"
let_underscore_must_use = "warn"
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
min_ident_chars = "warn"
mod_module_files = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
or_fun_call = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
significant_drop_in_scrutinee = "warn"
str_to_string = "warn"
string_slice = "warn"
tests_outside_test_module = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
try_err = "warn"
type_repetition_in_bounds = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_struct_initialization = "warn"
unneeded_field_pattern = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"
