[package]
name = "agent-run"
version = "0.1.0"
edition = "2024"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
core-link = { path = "../core-link" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "io-util", "rt", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["sync"] }
